# Two Let's Encrypt issuers. deploy.sh uses staging by default.
#
# Why staging is the default: sslip.io is not on the Public Suffix List, so
# every sslip.io user on the internet shares one Let's Encrypt rate limit
# (50 certificates per registered domain per week), and production issuance
# for *.sslip.io often fails. Staging issues an untrusted certificate (the
# browser will warn), but it proves the cert-manager -> ACME -> Traefik flow
# works.
#
# For a trusted certificate: point a domain you own at the Elastic IP and
# run deploy.sh with MOODLE_HOST=<that domain> CLUSTER_ISSUER=letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
