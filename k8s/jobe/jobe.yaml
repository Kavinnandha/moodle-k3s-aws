# Jobe: the sandbox CodeRunner sends student code to.
#
# How it is isolated from the web tier:
#   1. Own namespace, with Pod Security "baseline" enforced.
#   2. Scheduled onto the dedicated, tainted Jobe node (if that node exists),
#      so untrusted code never shares a kernel with Moodle or MySQL.
#   3. NetworkPolicy: only Moodle pods may reach it, and it has NO egress.
#      Submitted code cannot call the internet, the cluster or the VPC.
#   4. No service account token, and IMDSv2 hop limit 1 on the node, so no
#      Kubernetes or AWS credentials are reachable from inside the pod.
apiVersion: v1
kind: Service
metadata:
  name: jobe
  namespace: jobe
  labels:
    app.kubernetes.io/name: jobe
spec:
  selector:
    app.kubernetes.io/name: jobe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobe
  namespace: jobe
  labels:
    app.kubernetes.io/name: jobe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jobe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobe
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      tolerations:
        - key: moodle-k3s/jobe
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          # Preferred, not required: with enable_jobe_node = false in
          # Terraform, Jobe falls back to the server node instead of staying
          # Pending.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: moodle-k3s/role
                    operator: In
                    values: ["jobe"]
      containers:
        - name: jobe
          # jobeinabox only publishes "latest", so pin the digest for
          # reproducible deploys. Bump it on purpose.
          image: trampgeek/jobeinabox@sha256:b442c8e63f016ff33aa2b6f28c36abc8ebd30cbb39e8e025cadeec2107c5ce85
          ports:
            - name: http
              containerPort: 80
          securityContext:
            capabilities:
              drop: ["NET_RAW"]
          readinessProbe:
            httpGet:
              path: /jobe/index.php/restapi/languages
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: jobe
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-moodle-to-jobe
  namespace: jobe
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jobe
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: moodle
          podSelector:
            matchLabels:
              moodle-k3s/jobe-client: "true"
      ports:
        - protocol: TCP
          port: 80
