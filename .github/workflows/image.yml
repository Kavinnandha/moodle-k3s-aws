name: moodle-image

on:
  push:
    branches: [main]
    paths:
      - "docker/moodle/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "docker/moodle/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/moodle-coderunner

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase.
      - name: Image name
        id: name
        run: echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # PRs only build. Pushes to main publish :4.5 and :sha-<commit>.
      - uses: docker/build-push-action@v7
        with:
          context: docker/moodle
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}:4.5
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
