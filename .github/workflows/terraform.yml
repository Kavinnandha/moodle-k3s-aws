name: terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

# Static checks only. This workflow has no AWS credentials and never runs plan
# or apply.
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: actions/cache@v6
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('terraform/.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits when downloading the AWS ruleset

      - name: tflint
        run: tflint --format compact
